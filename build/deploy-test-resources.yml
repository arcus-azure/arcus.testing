name: Arcus Testing - Deploy test resources

trigger: none
pr: none

parameters:
  - name: azureServiceConnection
    displayName: 'Azure service connection'
    type: string
    default: 'Azure Codit-Arcus Service Principal'
  - name: resourceGroupName
    displayName: 'Resource group name'
    default: arcus-testing-dev-we-rg
  - name: keyVaultName
    displayName: 'Key Vault name'
    default: 'arcus-testing-kv'

variables:
  - template: ./variables/build.yml
  - template: ./variables/test.yml

resources:
  repositories:
    - repository: templates
      type: github
      name: arcus-azure/azure-devops-templates
      endpoint: arcus-azure

stages:
  - stage: Deploy
    jobs:
      - job: DeployBicep
        displayName: 'Deploy test resources'
        pool:
          vmImage: $(Vm.Image)
        steps:
          - task: AzureCLI@2
            env:
              ARCUS_TESTING_RESOURCEGROUP_NAME: ${{ parameters.resourceGroupName }}
              ARCUS_TESTING_KEYVAULT_NAME: ${{ parameters.keyVaultName }}
              ARCUS_TESTING_DATAFACTORY_NAME: $(Arcus.Testing.DataFactory.Name)
              ARCUS_TESTING_STORAGEACCOUNT_NAME: $(Arcus.Testing.StorageAccount.Name)
              ARCUS_TESTING_COSMOS_MONGODB_NAME: $(Arcus.Testing.Cosmos.MongoDb.Name)
              ARCUS_TESTING_COSMOS_MONGODB_DATABASENAME: $(Arcus.Testing.Cosmos.MongoDb.DatabaseName)
              ARCUS_TESTING_COSMOS_NOSQL_NAME: $(Arcus.Testing.Cosmos.NoSql.Name)
              ARCUS_TESTING_COSMOS_NOSQL_DATABASENAME: $(Arcus.Testing.Cosmos.NoSql.DatabaseName)
              ARCUS_TESTING_SERVICEBUS_NAMESPACE: $(Arcus.Testing.ServiceBus.Namespace)
              ARCUS_TESTING_STORAGEACCOUNT_KEY_SECRETNAME: $(Arcus.Testing.StorageAccount.Key.SecretName)
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              addSpnToEnvironment: true
              failOnStandardError: true
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $subscriptionDeploymentArguments = @(
                  '--location', 'westeurope'
                  '--template-file', './build/templates/resource-group.bicep'
                  '--parameters', "resourceGroupName=$env:ARCUS_TESTING_RESOURCEGROUP_NAME"
                  '--parameters', 'location=westeurope'
                )
                az deployment sub create @subscriptionDeploymentArguments

                $objectId = (az ad sp show --id $env:servicePrincipalId | ConvertFrom-Json).id
                $groupDeploymentArguments = @(
                  '--resource-group', $env:ARCUS_TESTING_RESOURCEGROUP_NAME
                  '--template-file', './build/templates/test-resources.bicep'
                  '--parameters', 'location=westeurope'
                  '--parameters', "dataFactoryName=$env:ARCUS_TESTING_DATAFACTORY_NAME"
                  '--parameters', "storageAccountName=$env:ARCUS_TESTING_STORAGEACCOUNT_NAME"
                  '--parameters', "cosmosDbMongoDbName=$env:ARCUS_TESTING_COSMOS_MONGODB_NAME"
                  '--parameters', "cosmosDbMongoDbDatabaseName=$env:ARCUS_TESTING_COSMOS_MONGODB_DATABASENAME"
                  '--parameters', "cosmosDbNoSqlName=$env:ARCUS_TESTING_COSMOS_NOSQL_NAME"
                  '--parameters', "cosmosDbNoSqlDatabaseName=$env:ARCUS_TESTING_COSMOS_NOSQL_DATABASENAME"
                  '--parameters', "serviceBusNamespaceName=$env:ARCUS_TESTING_SERVICEBUS_NAMESPACE"
                  '--parameters', "keyVaultName=$env:ARCUS_TESTING_KEYVAULT_NAME"
                  '--parameters', "servicePrincipalObjectId=$objectId"
                )
                az deployment group create @groupDeploymentArguments

                $accountKey = (az storage account keys list --account-name $env:ARCUS_TESTING_STORAGEACCOUNT_NAME | ConvertFrom-Json)[0].value
                az keyvault secret set --name $env:ARCUS_TESTING_STORAGEACCOUNT_KEY_SECRETNAME --value $accountKey --vault-name $env:ARCUS_TESTING_KEYVAULT_NAME

  - stage: SmokeTests
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: RunSmokeTests
        displayName: 'Run smoke tests'
        pool:
          vmImage: $(Vm.Image)
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              addSpnToEnvironment: true
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Install-Module -Name Az -Force -AllowClobber -SkipPublisherCheck
                Install-Module -Name Pester -Force -SkipPublisherCheck
                $PesterConfig = New-PesterConfiguration
                $PesterConfig.Run.Path = './build/templates/smoke-tests.ps1'
                $PesterConfig.TestResult.Enabled = $true
                $PesterConfig.TestResult.OutputFormat = 'NUnitXml'
                $PesterConfig.TestResult.OutputPath = './pester.test.results.xml'
                Invoke-Pester -Configuration $PesterConfig
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'NUnit'
              testResultsFiles: '**/pester.test.results.xml'
              failTaskOnFailedTests: true